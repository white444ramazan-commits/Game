name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Export Android ARM64 APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java, Android SDK packages and Godot export templates
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk-headless unzip curl
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_HOME="/usr/lib/android-sdk"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          echo "Godot Android settings:"
          grep -E "java_sdk_path|android_sdk_path" "$HOME/.config/godot/editor_settings-4.4.tres"

          curl -fL "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          echo "4.4.stable" > "$TEMPLATE_DIR/version.txt"

          echo "Installed Android SDK packages:"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
          echo "Godot export templates:"
          ls -lh "$TEMPLATE_DIR"/android_*.apk

      - name: Prepare debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and validate project
        run: |
          godot --headless --editor --path . --quit

      - name: Runtime smoke test
        run: |
          mkdir -p build
          if ! godot --headless --path . --quit-after 8 > build/runtime-smoke.log 2>&1; then
            cat build/runtime-smoke.log
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid assignment|Failed loading resource" build/runtime-smoke.log; then
            cat build/runtime-smoke.log
            exit 1
          fi
          cat build/runtime-smoke.log

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/CharacterStudio.apk
          test -s build/CharacterStudio.apk
          ls -lh build/CharacterStudio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elysia-Character-Studio-APK
          path: build/CharacterStudio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Android APK build ${{ github.run_number }}
          prerelease: true
          files: build/CharacterStudio.apk
          fail_on_unmatched_files: true
